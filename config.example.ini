# Tárcafigyelő – beállítások
# Ez a minta. Első indításkor a program config.ini néven lemásolja; azt szerkeszd.

[wallets]
# név = publikus cím   (legfeljebb 5 sor; a felületen is szerkeszthető)
# Példa:
# Fő tárca = 0x0000000000000000000000000000000000000000

[chains]
# Alchemy hálózatnév = megjelenített név, a lánc saját coinjának jele
# Amelyik láncot biztosan nem használod, azt töröld vagy # jellel kapcsold ki.
# Új láncot az Alchemy hálózatnevével lehet felvenni (például zksync-mainnet).
eth-mainnet = Ethereum, ETH
monad-mainnet = Monad, MON
base-mainnet = Base, ETH
arb-mainnet = Arbitrum, ETH
opt-mainnet = Optimism, ETH
polygon-mainnet = Polygon, POL
bnb-mainnet = BNB Chain, BNB
linea-mainnet = Linea, ETH
avax-mainnet = Avalanche, AVAX
gnosis-mainnet = Gnosis, XDAI
robinhood-mainnet = Robinhood, ETH

[wrapped_native]
# Ahol a coin jele nem egyértelmű vagy rövid múltú, ott a régi árát a "wrapped"
# változatának címén keresztül kérdezzük le. A többi láncon a jel (ETH, BNB…) elég.
monad-mainnet = 0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A
polygon-mainnet = 0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270
gnosis-mainnet = 0xe91D153E0b41518A2Ce8Dd3D7944Fa863463a97d

[budget]
# Az Alchemy ingyenes csomagja havi 30 millió CU. Ez a határ csak biztosíték,
# hogy egy hiba ne fogyassza el a keretet; a program becsült értékekkel számol.
monthly_cu = 20000000

[prices]
# Ahol az Alchemy nem ad árat (például a Monadon), ott a DexScreener legnagyobb párjából
# jön az ár. Ennél kisebb likviditású párt nem fogadunk el, mert scam tokenhez bárki
# tud hamis árat csinálni.
min_liquidity_usd = 500
